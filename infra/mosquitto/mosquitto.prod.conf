persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Autenticación mutua con certificados: el broker y cada dispositivo se identifican entre sí.
# Cada dispositivo tiene su propio certificado, firmado por la autoridad de certificación del
# laboratorio, y el nombre del certificado se usa como nombre de usuario
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true

allow_anonymous false
acl_file /mosquitto/config/acl
