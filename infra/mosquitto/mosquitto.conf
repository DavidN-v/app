# Desarrollo: acceso anónimo en la red de Docker / laboratorio.
# Producción: ver mosquitto.prod.conf (TLS + usuarios + ACL por dispositivo).
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous true

# WebSockets (por si quieres conectar MQTT.js directamente desde el navegador)
listener 9001
protocol websockets
