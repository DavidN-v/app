name: edge-governance

x-restart: &restart
  restart: unless-stopped

services:
  mosquitto:
    <<: *restart
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883", "9001:9001"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: governance
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance"]
      interval: 5s
      retries: 10

  api:
    <<: *restart
    build: ./backend
    environment:
      EG_DATABASE_URL: postgresql+psycopg://governance:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/governance
      EG_MQTT_HOST: mosquitto
      EG_JWT_SECRET: ${EG_JWT_SECRET:-change-me-with-at-least-32-random-chars}
      EG_ADMIN_PASSWORD: ${EG_ADMIN_PASSWORD:-admin123}
      EG_APPROVER_PASSWORD: ${EG_APPROVER_PASSWORD:-approver123}
      EG_OPERATOR_PASSWORD: ${EG_OPERATOR_PASSWORD:-operator123}
      EG_SEED_DEMO_DATA: ${EG_SEED_DEMO_DATA:-true}
      EG_CORS_ORIGINS: '["http://localhost:8080","http://localhost:4200"]'
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
    ports: ["8000:8000"]

  web:
    <<: *restart
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

  victoriametrics:
    <<: *restart
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -promscrape.config=/etc/vm/scrape.yml
      - -retentionPeriod=90d
    volumes:
      - ./infra/victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vm-data:/victoria-metrics-data
    ports: ["8428:8428"]

  grafana:
    <<: *restart
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [victoriametrics]
    ports: ["3000:3000"]

  # Dispositivos simulados: docker compose --profile demo up
  simulator:
    profiles: ["demo"]
    build: ./simulator
    command: ["--host", "mosquitto"]
    environment:
      # Con el perfil "real": SIM_SKIP=rpi5-vision,rpi5-genai,rpi5-agent para no duplicar las placas reales
      SIM_SKIP: ${SIM_SKIP:-}
    depends_on: [mosquitto, api]

  # Dispositivos reales en contenedor: docker compose --profile real up -d
  rpi5-vision:
    profiles: ["real"]
    build:
      context: .
      dockerfile: devices/vision/Dockerfile
    image: edge-governance-rpi5-vision
    environment:
      EDGE_DEVICE_ID: rpi5-vision
      EDGE_MQTT_HOST: mosquitto
      VISION_FPS: ${VISION_FPS:-4}
      VISION_DIRTY_EVERY: ${VISION_DIRTY_EVERY:-300}
    volumes: [vision-models:/data/models]
    depends_on: [mosquitto, api]
    ports: ["8101:8101"]

  # Modelo de lenguaje real: llama.cpp sirviendo Qwen2.5-0.5B-Instruct (Apache 2.0) en CPU
  genai-llm:
    profiles: ["real"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --hf-repo
      - Qwen/Qwen2.5-0.5B-Instruct-GGUF
      - --hf-file
      - qwen2.5-0.5b-instruct-q4_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "4"
    environment:
      LLAMA_CACHE: /models
    volumes: [llm-models:/models]

  rpi5-genai:
    profiles: ["real"]
    build:
      context: .
      dockerfile: devices/genai/Dockerfile
    image: edge-governance-rpi5-genai
    environment:
      EDGE_DEVICE_ID: rpi5-genai
      EDGE_MQTT_HOST: mosquitto
      LLM_URL: http://genai-llm:8080
      GOV_API_URL: http://api:8000
      GENAI_AUTO_ASK_S: ${GENAI_AUTO_ASK_S:-20}
    depends_on: [mosquitto, api, genai-llm]
    ports: ["8102:8102"]

  # Agente real: su propia telemetría + detector de anomalías sobre la telemetría de la flota
  rpi5-agent:
    profiles: ["real"]
    build:
      context: .
      dockerfile: devices/agent/Dockerfile
    image: edge-governance-rpi5-agent
    environment:
      EDGE_DEVICE_ID: rpi5-agent
      EDGE_MQTT_HOST: mosquitto
    depends_on: [mosquitto, api]
    ports: ["8103:8103"]

volumes:
  mosquitto-data:
  postgres-data:
  vm-data:
  grafana-data:
  vision-models:
  llm-models:
