<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPI5-GENAI · Asistente industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#15181d; --cell:#1c2027; --cell2:#232831; --line:#313844; --text:#f2f4f7; --muted:#a9b1bd; --dim:#788292;
          --unit:#c084fc; --green:#4af626; --red:#ff2a2a; --yellow:#facc15; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 'JetBrains Mono', Consolas, monospace; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.1) 2px 3px); }
  .screen { display: grid; grid-template-rows: auto 1fr auto auto; height: 100%; border-top: 3px solid var(--unit); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font: 900 24px/1 Archivo, 'Arial Black', sans-serif; letter-spacing: -.04em; text-transform: uppercase; }
  .unit { color: var(--unit); font-size: 11px; letter-spacing: .14em; font-weight: 700; }
  .state { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); }
  .state.ready { color: var(--green); } .state.busy { color: var(--unit); }
  .state i { display: inline-block; width: 8px; height: 8px; background: currentColor; margin-right: 8px; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .chat { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 760px; padding: 12px 14px; border: 1px solid var(--line); background: var(--cell); }
  .msg.q { align-self: flex-end; background: var(--cell2); border-color: var(--unit); }
  .msg.err { border-color: var(--red); color: var(--red); }
  .msg small { display: block; margin-bottom: 6px; color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .msg.q small { color: var(--unit); }
  .msg p { margin: 0; white-space: pre-wrap; }
  .empty { color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .thinking::after { content: '█'; animation: blink 1s steps(2) infinite; }
  form { display: flex; gap: 0; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 14px 18px; background: var(--bg); color: var(--text); border: 0; font: inherit; font-size: 14px; outline: none; }
  input:focus { background: var(--cell); }
  button { padding: 0 22px; border: 0; background: var(--unit); color: #000; font: 700 12px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: .4; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .chips button { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .chips button:hover { color: var(--text); border-color: var(--unit); }
  footer { display: flex; border-top: 1px solid var(--line); }
  footer div { flex: 1; padding: 10px 18px; border-right: 1px solid var(--line); }
  footer div:last-child { border-right: 0; }
  footer small { display: block; color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  footer b { font: 900 22px/1.1 Archivo, sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  footer .model b { font: 500 13px/1.6 'JetBrains Mono', monospace; letter-spacing: 0; }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div><div class="unit">UNIT / 02 · RPI5-GENAI</div><h1>Raspberry Pi 5 · Asistente industrial</h1></div>
    <div class="state" id="state"><i></i><span>Cargando modelo…</span></div>
  </header>
  <section class="chat" id="chat" aria-live="polite"><p class="empty">// Pregunta por el estado de la flota</p></section>
  <div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <input id="q" autocomplete="off" placeholder="¿Cuál es el estado de los sensores hoy?" aria-label="Pregunta">
      <button id="send" type="submit">Enviar >>></button>
    </form>
  </div>
  <footer>
    <div><small>Tokens / s</small><b id="tps">—</b></div>
    <div><small>Por token</small><b id="mpt">—</b></div>
    <div><small>Respuesta</small><b id="total">—</b></div>
    <div class="model"><small>Modelo</small><b id="model">—</b></div>
  </footer>
</div>
<script>
  const SUGGESTIONS = ['¿Cuál es el estado de los sensores hoy?', '¿Qué dispositivo está más caliente?', '¿Qué alertas hay abiertas?'];
  const chat = document.getElementById('chat'), form = document.getElementById('form'), q = document.getElementById('q'), send = document.getElementById('send');
  let pending = null, lastCount = -1;
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const time = (ts) => new Date(ts * 1000).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  document.getElementById('chips').innerHTML = SUGGESTIONS.map((s) => `<button type="button">${s}</button>`).join('');
  document.getElementById('chips').addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') { q.value = e.target.textContent; form.requestSubmit(); } });

  function render(history) {
    if (!history.length && !pending) return;
    let html = history.map((h) => `
      <div class="msg q"><small>${h.source === 'auto' ? 'Operador automático' : 'Operador'} · ${time(h.ts)}</small><p>${esc(h.q)}</p></div>
      <div class="msg${h.error ? ' err' : ''}"><small>Asistente${h.seconds ? ' · ' + h.seconds + ' s · ' + h.tokens + ' tokens' : ''}</small><p>${esc(h.a)}</p></div>`).join('');
    if (pending) html += `<div class="msg q"><small>Operador</small><p>${esc(pending)}</p></div><div class="msg"><small>Asistente</small><p class="thinking">Pensando </p></div>`;
    chat.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  }

  async function refresh() {
    try {
      const s = await (await fetch('/state', { cache: 'no-store' })).json();
      const st = document.getElementById('state');
      st.className = 'state ' + (!s.ready ? '' : s.busy ? 'busy' : 'ready');
      st.querySelector('span').textContent = !s.ready ? 'Cargando modelo…' : s.busy ? 'Generando respuesta' : 'Modelo listo';
      document.getElementById('model').textContent = s.model;
      document.getElementById('tps').textContent = s.stats.tokens_per_s ?? '—';
      document.getElementById('mpt').textContent = s.stats.ms_per_token != null ? s.stats.ms_per_token + ' ms' : '—';
      document.getElementById('total').textContent = s.stats.total_ms != null ? (s.stats.total_ms / 1000).toFixed(1) + ' s' : '—';
      if (s.history.length !== lastCount || pending) { lastCount = s.history.length; render(s.history); }
    } catch { /* el dispositivo se está reiniciando */ }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = q.value.trim();
    if (!question || pending) return;
    pending = question; q.value = ''; send.disabled = true; refresh();
    try { await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }) }); }
    finally { pending = null; send.disabled = false; lastCount = -1; refresh(); q.focus(); }
  });
  refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
