; Firmware ESP32: regresión ambiental con TFLite Micro + telemetría MQTT
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
    adafruit/Adafruit SSD1306@^2.5.13
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    ; Credenciales por entorno: export WIFI_SSID=... antes de compilar
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DMQTT_HOST=\"${sysenv.MQTT_HOST}\"
    -DDEVICE_ID=\"esp32-env\"

; Simulación en Wokwi (extensión de VS Code): red Wokwi-GUEST y broker del host
; a través del gateway privado de Wokwi. Compilar: pio run -e wokwi
[env:wokwi]
extends = env:esp32dev
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASS=\"\"
    -DWIFI_CHANNEL=6
    -DMQTT_HOST=\"host.wokwi.internal\"
    -DDEVICE_ID=\"esp32-env\"
