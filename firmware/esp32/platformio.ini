; Firmware del ESP32: índice de confort con TensorFlow Lite Micro y envío de datos por MQTT.
;
; Entornos:
;   esp32dev  placa real, MQTT sin cifrar (puerto 1883, red de confianza o desarrollo)
;   esp32tls  placa real, MQTT cifrado con certificado propio (puerto 8883, producción)
;   wokwi     simulador Wokwi de VS Code
;
; Antes de compilar para la placa real se indican la red WiFi y el servidor:
;   export WIFI_SSID=MiRed WIFI_PASS=clave MQTT_HOST=192.168.1.50     (Linux, macOS, Git Bash)
;   $env:WIFI_SSID="MiRed"; $env:WIFI_PASS="clave"; $env:MQTT_HOST="192.168.1.50"   (PowerShell)
;   pio run -e esp32dev -t upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
    adafruit/Adafruit SSD1306@^2.5.13
    sensirion/Sensirion I2C SCD4x@^1.0.0
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    ; Credenciales por entorno: export WIFI_SSID=... antes de compilar
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DMQTT_HOST=\"${sysenv.MQTT_HOST}\"
    -DDEVICE_ID=\"esp32-env\"
    ; Sensor Sensirion SCD40/SCD41 por I2C; si no está conectado se usan valores simulados
    -DSENSOR_SCD4X

; Placa real con TLS: generar antes src/certs.h con generar-certs-h.sh
[env:esp32tls]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DMQTT_TLS

; Simulación en Wokwi (extensión de VS Code): red Wokwi-GUEST y broker del host
; a través del gateway privado de Wokwi. Compilar: pio run -e wokwi
[env:wokwi]
extends = env:esp32dev
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASS=\"\"
    -DWIFI_CHANNEL=6
    -DMQTT_HOST=\"host.wokwi.internal\"
    -DDEVICE_ID=\"esp32-env\"
